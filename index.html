<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Brechó - Cadastro de Itens</title>
</head>
<body>
  <h1>Cadastro de Itens do Brechó</h1>

  <form id="formItem">
    <label>Nome: <input type="text" id="nome" required></label><br><br>
    <label>Descrição: <textarea id="descricao"></textarea></label><br><br>
    <label>Preço: <input type="number" step="0.01" id="preco" required></label><br><br>
    <button type="submit">Cadastrar</button>
  </form>

  <h2>Itens cadastrados</h2>
  <ul id="listaItens"></ul>

  <script>
    const form = document.getElementById('formItem');
    const lista = document.getElementById('listaItens');

    async function carregarItens() {
      const resposta = await fetch('http://localhost:3000/itens');
      const itens = await resposta.json();

      lista.innerHTML = '';
      itens.forEach((item) => {
        const li = document.createElement('li');
        li.textContent = `${item.nome} - R$ ${item.preco} (${item.status})`;
        lista.appendChild(li);
      });
    }

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();

      const novoItem = {
        nome: document.getElementById('nome').value,
        descricao: document.getElementById('descricao').value,
        preco: document.getElementById('preco').value,
      };

      await fetch('http://localhost:3000/itens', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(novoItem),
      });

      form.reset();
      carregarItens();
    });

    carregarItens();
  </script>
</body>
</html>
